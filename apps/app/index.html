<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App - Lumine</title>
  <meta name="description" content="アプリの配布ページです。">
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>

<body data-page="app-detail" data-base="../../">
  <header class="site-header">
    <a class="brand" href="../../apps/" aria-label="Lumine">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Lumine</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="../../apps/" aria-current="page">Apps</a>
      <a href="#">Notes</a>
      <a class="external-link" href="https://github.com/7Lumine" target="_blank" rel="noopener noreferrer">
        GitHub
        <svg class="external-link-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 17L17 7M17 7H9M17 7V15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </a>
    </nav>
  </header>

  <main class="page-shell">
    <a class="back-link" href="../../apps/">Apps 一覧に戻る</a>

    <section class="app-hero" aria-live="polite">
      <div class="hero-copy">
        <div class="hero-title-row">
          <img class="app-icon" id="app-icon" src="../../public/images/apps/sounddeck/icon.png" alt="">
          <div>
            <p class="eyebrow" id="app-status">App</p>
            <h1 id="app-title">App</h1>
          </div>
        </div>
        <p class="hero-summary" id="app-summary"></p>
        <div class="tag-list" id="app-tags"></div>
        <div class="button-row">
          <a class="button primary" id="download-button" href="#">Download</a>
          <a class="button secondary" id="github-button" href="#">GitHub</a>
        </div>
      </div>

      <figure class="screenshot-frame">
        <img id="app-screenshot" src="../../public/images/apps/sounddeck/screenshot.png" alt="">
      </figure>
    </section>

    <div class="content-layout">
      <article class="markdown-panel prose" id="markdown-content" aria-live="polite"></article>

      <aside class="side-column">
        <section class="info-card">
          <h2>Download Info</h2>
          <dl class="download-facts" id="download-facts"></dl>
          <a class="button primary full" id="release-link" href="#">GitHub Releases</a>
        </section>
      </aside>
    </div>
  </main>

  <script src="../../assets/js/site.js" defer></script>
</body>

</html>
